[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeops-okf"
version = "0.1.0"
description = "Tooling for authoring, validating, indexing and serving OKF v0.2 knowledge bundles."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
okf = "okf.cli:main"

[tool.setuptools]
package-dir = {"" = "tools"}

[tool.setuptools.packages.find]
where = ["tools"]
